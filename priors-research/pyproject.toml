[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priors-research"
version = "1.1.0"
description = "Priors — behavioural model research repo. SPEC.md and SCHEMA.md are the contract."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["priors"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
